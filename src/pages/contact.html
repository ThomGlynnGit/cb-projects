<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CB-Projects</title>
  </head>
  <body>
    <div class="head-container">
      <div class="nav-container">
        <h3 class="logo">CB<br />Projects</h3>
        <div class="nav-buttons">
          <a href="./index.html" class="nav-btn">Home</a>
          <a href="./about.html" class="nav-btn">About</a>
          <a href="./projects.html" class="nav-btn">Projects</a>
          <a href="./contact.html" class="nav-btn">Contact us</a>
        </div>
      </div>
    </div>
    <div class="content-container">
      <div class="contact-container">
        <div class="contact-head-container">
          <h1>Contact us</h1>

          <p class="para-small">
            Complete the form below to discuss a project or request further
            information.
          </p>
        </div>

        <div data-fs-success class="form-success"></div>
        <div data-fs-error class="form-error"></div>

        <form id="contact-form" class="contact-form">
          <div class="form-field">
            <label for="name">Name</label>

            <input
              type="text"
              id="name"
              name="name"
              autocomplete="name"
              data-fs-field
              required
            />

            <span data-fs-error="name" class="field-error"></span>
          </div>

          <div class="form-field">
            <label for="email">Email address</label>

            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              data-fs-field
              required
            />

            <span data-fs-error="email" class="field-error"></span>
          </div>

          <div class="form-field">
            <label for="phone">Telephone number</label>

            <input
              type="tel"
              id="phone"
              name="phone"
              autocomplete="tel"
              data-fs-field
            />

            <span data-fs-error="phone" class="field-error"></span>
          </div>

          <div class="form-field">
            <label for="subject">Enquiry subject</label>

            <input
              type="text"
              id="subject"
              name="subject"
              data-fs-field
              required
            />

            <span data-fs-error="subject" class="field-error"></span>
          </div>

          <div class="form-field">
            <label for="message">Project details</label>

            <textarea
              id="message"
              name="message"
              rows="8"
              data-fs-field
              required
            ></textarea>

            <span data-fs-error="message" class="field-error"></span>
          </div>

          <button type="submit" class="form-submit" data-fs-submit-btn>
            Send enquiry
          </button>
        </form>
      </div>
      <div class="footer-container">
        <div class="address-bar">
          <h3 class="head-small">CB Projects - structural design</h3>
          <p class="address">37 Brighton lane, The lanes, Brighton, BR45 6EQ</p>
        </div>
      </div>
    </div>
    <script>
      window.formspree =
        window.formspree ||
        function () {
          (formspree.q = formspree.q || []).push(arguments);
        };

      formspree("initForm", {
        formElement: "#contact-form",
        formId: "mzdnabvj",
        useDefaultStyles: false,
      });
    </script>

    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
  </body>
</html>
