  <body>
    <!--
      Sveltia CMS reads config.yml from this folder. The version is pinned and
      the integrity hash makes the browser refuse the script if it's altered.
      To upgrade, change the version and replace the hash with the output of:
      curl -sL <script url> | openssl dgst -sha384 -binary | openssl base64 -A
    -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.218.3/dist/sveltia-cms.js"
      integrity="sha384-e7XprdmCWh1yj+hh6iu3tXgknMI7xbGIx+iDJZq3y6XMjDGDO3+HiCO0PHT+eyF2"
      crossorigin="anonymous"
    ></script>
  </body>
